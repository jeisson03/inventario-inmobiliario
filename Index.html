<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventario Inmobiliario</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      color: #fff;
    }

    .container { max-width: 500px; margin: 0 auto; padding: 16px; }

    .header {
      text-align: center;
      padding: 15px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p { color: #8892b0; font-size: 0.85rem; margin-top: 4px; }

    .seccion {
      background: rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .seccion-titulo {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .campo { margin-bottom: 12px; }

    .campo label {
      display: block;
      font-size: 0.8rem;
      color: #8892b0;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .campo input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      font-size: 1rem;
    }

    .campo input:focus {
      outline: none;
      border-color: #00d9ff;
    }

    .campo input::placeholder { color: #5a6580; }

    .boton {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .boton:disabled { opacity: 0.5; cursor: not-allowed; }

    .boton-primario {
      background: linear-gradient(90deg, #00d9ff, #00ff88);
      color: #0f0c29;
    }

    .boton-guardar {
      background: linear-gradient(90deg, #00ff88, #00d9ff);
      color: #0f0c29;
      margin-top: 10px;
    }

    .boton-cancelar {
      background: rgba(255,255,255,0.1);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      margin-top: 8px;
    }

    .boton-camara {
      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: #fff;
      padding: 18px;
      font-size: 1.1rem;
    }

    .boton-galeria {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      margin-top: 8px;
    }

    .boton-secundario {
      background: rgba(255,255,255,0.08);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      margin-top: 8px;
    }

    .fotos-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }

    .foto-preview {
      position: relative;
      aspect-ratio: 1;
      border-radius: 10px;
      overflow: hidden;
      background: rgba(0,0,0,0.3);
    }

    .foto-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .foto-preview .eliminar {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(255,0,0,0.85);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .foto-preview .numero {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(0,0,0,0.7);
      border-radius: 5px;
      padding: 1px 6px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .inmueble-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      margin-bottom: 8px;
    }

    .inmueble-nombre { font-weight: 600; font-size: 0.9rem; }
    .inmueble-fotos { color: #8892b0; font-size: 0.75rem; margin-top: 2px; }

    .inmueble-acciones { display: flex; gap: 6px; }

    .btn-sm {
      padding: 6px 10px;
      border: none;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .btn-ver { background: rgba(0,217,255,0.2); color: #00d9ff; }
    .btn-descargar { background: rgba(0,255,136,0.2); color: #00ff88; }

    .estado {
      text-align: center;
      padding: 12px;
      border-radius: 10px;
      margin-top: 12px;
      font-weight: 500;
      font-size: 0.9rem;
    }

    .estado-activo { background: rgba(0,217,255,0.15); color: #00d9ff; }
    .estado-guardando { background: rgba(255,193,7,0.15); color: #ffc107; }
    .estado-exito { background: rgba(0,255,136,0.15); color: #00ff88; }
    .estado-error { background: rgba(255,107,107,0.15); color: #ff6b6b; }

    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    #input-foto, #input-galeria { display: none; }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }

    @media (max-width: 400px) {
      .fotos-container { grid-template-columns: repeat(2, 1fr); }
    }

    /* ===== CAMARA EN VIVO ===== */
    #camara-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #000;
      z-index: 2000;
      flex-direction: column;
    }

    #camara-overlay.activo { display: flex; }

    #camara-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: rgba(0,0,0,0.85);
      z-index: 10;
    }

    .camara-nombre { font-weight: 600; font-size: 0.85rem; color: #00d9ff; }

    .camara-contador {
      background: rgba(255,107,107,0.85);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
    }

    #camara-video-container {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    #camara-video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #camara-canvas { display: none; }

    #camara-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      background: rgba(0,0,0,0.85);
      gap: 28px;
    }

    #btn-disparar {
      width: 75px;
      height: 75px;
      border-radius: 50%;
      border: 5px solid #fff;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      position: relative;
      transition: transform 0.1s;
    }

    #btn-disparar::after {
      content: '';
      position: absolute;
      top: 7px; left: 7px; right: 7px; bottom: 7px;
      border-radius: 50%;
      background: #fff;
    }

    #btn-disparar:active { transform: scale(0.88); }
    #btn-disparar:active::after { background: #ff6b6b; }

    .cam-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cam-btn.flash-on { background: rgba(255,193,7,0.5); border-color: #ffc107; }

    .flash-anim { animation: flashFx 0.15s ease; }

    @keyframes flashFx {
      0% { opacity: 1; }
      50% { opacity: 0.2; }
      100% { opacity: 1; }
    }

    .preview-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 8px 0;
    }

    .preview-strip::-webkit-scrollbar { height: 3px; }

    .strip-thumb {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.15);
      flex-shrink: 0;
    }

    .strip-thumb.ultima {
      border-color: #00ff88;
      box-shadow: 0 0 8px rgba(0,255,136,0.4);
    }

    .preview-strip-container {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Inventario Inmobiliario</h1>
      <p>Organiza tus fotos de propiedades</p>
    </div>

    <!-- Nuevo Inmueble -->
    <div class="seccion" id="seccion-nuevo">
      <div class="seccion-titulo">Nuevo Inmueble</div>
      <div class="campo">
        <label>Nombre del Inmueble</label>
        <input type="text" id="nombre-inmueble" placeholder="Ej: Calle Principal 123">
      </div>
      <button class="boton boton-primario" onclick="iniciarSesion()">Iniciar</button>
    </div>

    <!-- Captura -->
    <div class="seccion" id="seccion-captura" style="display:none;">
      <div class="seccion-titulo">Capturar Fotos</div>
      <div class="campo">
        <label>Inmueble: <strong id="inmueble-actual"></strong></label>
      </div>

      <button class="boton boton-camara" onclick="abrirCamara()">Tomar Fotos</button>
      <button class="boton boton-galeria" onclick="document.getElementById('input-galeria').click()">Seleccionar de Galeria</button>

      <input type="file" id="input-galeria" accept="image/*" multiple onchange="procesarGaleria(event)">

      <div class="preview-strip-container">
        <div id="preview-strip" class="preview-strip"></div>
      </div>

      <div id="fotos-preview" class="fotos-container"></div>

      <div id="estado-captura" class="estado estado-activo">
        <span id="contador-fotos">0</span> fotos capturadas
      </div>

      <button class="boton boton-guardar" id="btn-guardar" onclick="guardarInmueble()">Guardar Inmueble</button>
      <button class="boton boton-cancelar" onclick="cancelarSesion()">Cancelar</button>
    </div>

    <!-- Inmuebles guardados -->
    <div class="seccion">
      <div class="seccion-titulo">Inmuebles Guardados</div>
      <div id="lista-inmuebles"><p style="color:#8892b0;text-align:center;padding:20px;"><span class="spinner"></span> Cargando...</p></div>
      <button class="boton boton-secundario" onclick="cargarInmuebles()">Actualizar Lista</button>
    </div>
  </div>

  <!-- CAMARA -->
  <div id="camara-overlay">
    <div id="camara-header">
      <span class="camara-nombre" id="camara-nombre"></span>
      <span class="camara-contador" id="camara-contador">0 fotos</span>
    </div>
    <div id="camara-video-container">
      <video id="camara-video" autoplay playsinline muted></video>
      <canvas id="camara-canvas"></canvas>
    </div>
    <div id="camara-footer">
      <button class="cam-btn" id="btn-cerrar-camara" onclick="cerrarCamara()">X</button>
      <button id="btn-disparar" onclick="tomarFoto()"></button>
      <button class="cam-btn" id="btn-flash" onclick="toggleFlash()">Flash</button>
    </div>
  </div>

  <!-- Modal fotos -->
  <div id="modal-fotos" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.95);z-index:1000;padding:16px;">
    <div style="max-width:500px;margin:0 auto;height:100%;display:flex;flex-direction:column;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
        <h3 id="modal-titulo" style="color:#fff;font-size:1rem;"></h3>
        <button onclick="cerrarModal()" style="background:none;border:none;color:#fff;font-size:22px;cursor:pointer;">X</button>
      </div>
      <div id="modal-fotos-container" style="flex:1;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- MODAL CONFIGURAR URL -->
  <div id="modal-config" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.9);z-index:3000;padding:20px;">
    <div style="max-width:450px;margin:80px auto;background:#1e1e2e;border-radius:16px;padding:24px;border:1px solid rgba(255,255,255,0.1);">
      <h3 style="margin-bottom:12px;">Configurar URL del Servidor</h3>
      <p style="color:#8892b0;font-size:0.85rem;margin-bottom:12px;">Pega la URL de tu Google Apps Script (la que termina en /exec)</p>
      <div class="campo">
        <input type="text" id="input-url-api" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <button class="boton boton-primario" onclick="guardarURL()" style="margin-top:8px;">Guardar</button>
      <button class="boton boton-cancelar" onclick="document.getElementById('modal-config').style.display='none'">Cancelar</button>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURACION
    // ============================================
    var API_URL = localStorage.getItem('api_url') || '';

    // Si no hay URL configurada, mostrar modal
    if (!API_URL) {
      document.getElementById('modal-config').style.display = 'block';
    }

    function guardarURL() {
      var url = document.getElementById('input-url-api').value.trim();
      if (!url) { alert('Ingresa la URL'); return; }
      API_URL = url;
      localStorage.setItem('api_url', url);
      document.getElementById('modal-config').style.display = 'none';
      cargarInmuebles();
    }

    function apiGet(action, params) {
      var qs = 'action=' + action;
      if (params) {
        for (var k in params) { qs += '&' + k + '=' + encodeURIComponent(params[k]); }
      }
      return fetch(API_URL + '?' + qs).then(function(r) { return r.json(); });
    }

    function apiPost(body) {
      return fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(body)
      }).then(function() {
        return new Promise(function(resolve) {
          setTimeout(function() {
            fetch(API_URL + '?action=listar').then(function(r) { return r.json(); }).then(resolve);
          }, 3000);
        });
      });
    }

    // ============================================
    // VARIABLES
    // ============================================
    var fotosCapturadas = [];
    var inmuebleActualId = null;
    var streamCamara = null;
    var flashOn = false;

    // ============================================
    // SESION
    // ============================================
    function iniciarSesion() {
      var nombre = document.getElementById('nombre-inmueble').value.trim();
      if (!nombre) { mostrarEstado('Ingresa un nombre', 'error'); return; }

      mostrarEstado('Creando inmueble...', 'guardando');

      apiPost({ action: 'crear', nombre: nombre })
        .then(function(resultado) {
          if (resultado && resultado.success) {
            inmuebleActualId = resultado.id;
            fotosCapturadas = [];
            document.getElementById('seccion-nuevo').style.display = 'none';
            document.getElementById('seccion-captura').style.display = 'block';
            document.getElementById('inmueble-actual').textContent = nombre;
            actualizarContador();
            mostrarEstado('Listo para capturar fotos', 'activo');
          } else {
            mostrarEstado('Error: ' + (resultado ? resultado.error : 'Sin respuesta'), 'error');
          }
        })
        .catch(function(err) {
          mostrarEstado('Error de conexion', 'error');
          console.error(err);
        });
    }

    // ============================================
    // CAMARA EN VIVO
    // ============================================
    function abrirCamara() {
      var overlay = document.getElementById('camara-overlay');
      var video = document.getElementById('camara-video');
      var nombre = document.getElementById('inmueble-actual').textContent;

      document.getElementById('camara-nombre').textContent = nombre;
      document.getElementById('camara-contador').textContent = fotosCapturadas.length + ' fotos';
      overlay.classList.add('activo');

      var constraints = {
        video: {
          facingMode: 'environment',
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      };

      navigator.mediaDevices.getUserMedia(constraints)
        .then(function(stream) {
          streamCamara = stream;
          video.srcObject = stream;
        })
        .catch(function(err) {
          console.error('Error camara:', err);
          cerrarCamara();
          alert('No se pudo acceder a la camara. Verifica los permisos.');
        });
    }

    function cerrarCamara() {
      var overlay = document.getElementById('camara-overlay');
      var video = document.getElementById('camara-video');

      if (streamCamara) {
        streamCamara.getTracks().forEach(function(t) { t.stop(); });
        streamCamara = null;
      }
      video.srcObject = null;
      overlay.classList.remove('activo');
    }

    function tomarFoto() {
      var video = document.getElementById('camara-video');
      var canvas = document.getElementById('camara-canvas');

      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      var ctx = canvas.getContext('2d');

      if (flashOn) { ctx.filter = 'brightness(1.3)'; }
      ctx.drawImage(video, 0, 0);
      ctx.filter = 'none';

      var dataURL = canvas.toDataURL('image/jpeg', 0.85);
      var base64 = dataURL.split(',')[1];
      var nombreFoto = 'foto_' + (fotosCapturadas.length + 1) + '_' + Date.now() + '.jpg';

      fotosCapturadas.push({ base64: base64, nombre: nombreFoto });

      // Flash visual
      var vc = document.getElementById('camara-video-container');
      vc.classList.add('flash-anim');
      setTimeout(function() { vc.classList.remove('flash-anim'); }, 150);

      document.getElementById('camara-contador').textContent = fotosCapturadas.length + ' fotos';
      actualizarContador();
      actualizarPreviewStrip();
    }

    function toggleFlash() {
      flashOn = !flashOn;
      var btn = document.getElementById('btn-flash');
      btn.classList.toggle('flash-on', flashOn);
    }

    // ============================================
    // GALERIA
    // ============================================
    function procesarGaleria(event) {
      var archivos = event.target.files;
      if (!archivos || archivos.length === 0) return;

      mostrarEstado('Procesando ' + archivos.length + ' fotos...', 'guardando');

      var procesadas = 0;
      for (var i = 0; i < archivos.length; i++) {
        (function(archivo) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var base64 = e.target.result.split(',')[1];
            var nombreFoto = 'foto_' + (fotosCapturadas.length + 1) + '_' + Date.now() + '.jpg';
            fotosCapturadas.push({ base64: base64, nombre: nombreFoto });
            procesadas++;
            if (procesadas === archivos.length) {
              actualizarPreview();
              actualizarContador();
              actualizarPreviewStrip();
              mostrarEstado(procesadas + ' fotos agregadas', 'activo');
            }
          };
          reader.readAsDataURL(archivo);
        })(archivos[i]);
      }

      event.target.value = '';
    }

    // ============================================
    // PREVIEWS
    // ============================================
    function actualizarPreview() {
      var contenedor = document.getElementById('fotos-preview');
      contenedor.innerHTML = '';
      fotosCapturadas.forEach(function(foto, i) {
        var div = document.createElement('div');
        div.className = 'foto-preview';
        div.innerHTML =
          '<img src="data:image/jpeg;base64,' + foto.base64 + '">' +
          '<button class="eliminar" onclick="eliminarFoto(' + i + ')">X</button>' +
          '<span class="numero">#' + (i + 1) + '</span>';
        contenedor.appendChild(div);
      });
    }

    function actualizarPreviewStrip() {
      var strip = document.getElementById('preview-strip');
      strip.innerHTML = '';
      fotosCapturadas.forEach(function(foto, i) {
        var img = document.createElement('img');
        img.className = 'strip-thumb' + (i === fotosCapturadas.length - 1 ? ' ultima' : '');
        img.src = 'data:image/jpeg;base64,' + foto.base64;
        strip.appendChild(img);
      });
      strip.scrollLeft = strip.scrollWidth;
    }

    function eliminarFoto(index) {
      fotosCapturadas.splice(index, 1);
      actualizarPreview();
      actualizarContador();
      actualizarPreviewStrip();
      var cc = document.getElementById('camara-contador');
      if (cc) cc.textContent = fotosCapturadas.length + ' fotos';
    }

    function actualizarContador() {
      document.getElementById('contador-fotos').textContent = fotosCapturadas.length;
    }

    // ============================================
    // GUARDAR
    // ============================================
    function guardarInmueble() {
      if (fotosCapturadas.length === 0) {
        mostrarEstado('Captura al menos una foto', 'error');
        return;
      }

      mostrarEstado('Guardando ' + fotosCapturadas.length + ' fotos...', 'guardando');
      document.getElementById('btn-guardar').disabled = true;

      apiPost({ action: 'guardarFotos', carpetaId: inmuebleActualId, fotos: fotosCapturadas })
        .then(function(resultado) {
          if (resultado && resultado.success) {
            mostrarEstado('Inmueble guardado!', 'exito');
            setTimeout(function() {
              reiniciarApp();
              cargarInmuebles();
            }, 2000);
          } else {
            mostrarEstado('Error al guardar', 'error');
            document.getElementById('btn-guardar').disabled = false;
          }
        })
        .catch(function(err) {
          mostrarEstado('Error de conexion', 'error');
          document.getElementById('btn-guardar').disabled = false;
          console.error(err);
        });
    }

    function cancelarSesion() {
      if (fotosCapturadas.length > 0 && !confirm('Se perderan las fotos. Cancelar?')) return;
      reiniciarApp();
    }

    function reiniciarApp() {
      fotosCapturadas = [];
      inmuebleActualId = null;
      document.getElementById('nombre-inmueble').value = '';
      document.getElementById('seccion-nuevo').style.display = 'block';
      document.getElementById('seccion-captura').style.display = 'none';
      document.getElementById('fotos-preview').innerHTML = '';
      document.getElementById('preview-strip').innerHTML = '';
      document.getElementById('btn-guardar').disabled = false;
      document.getElementById('estado-captura').style.display = 'none';
    }

    // ============================================
    // LISTA INMUEBLES
    // ============================================
    function cargarInmuebles() {
      if (!API_URL) { document.getElementById('modal-config').style.display = 'block'; return; }

      var contenedor = document.getElementById('lista-inmuebles');
      contenedor.innerHTML = '<p style="color:#8892b0;text-align:center;"><span class="spinner"></span> Cargando...</p>';

      apiGet('listar')
        .then(function(resultado) {
          if (resultado && resultado.success) {
            if (resultado.inmuebles.length === 0) {
              contenedor.innerHTML = '<p style="color:#8892b0;text-align:center;padding:20px;">No hay inmuebles</p>';
              return;
            }
            contenedor.innerHTML = '';
            resultado.inmuebles.forEach(function(inm) {
              var div = document.createElement('div');
              div.className = 'inmueble-item';
              div.innerHTML =
                '<div><div class="inmueble-nombre">' + inm.nombre + '</div>' +
                '<div class="inmueble-fotos">' + inm.fotos + ' fotos</div></div>' +
                '<div class="inmueble-acciones">' +
                '<button class="btn-sm btn-ver" onclick="verFotos(\'' + inm.id + '\',\'' + inm.nombre.replace(/'/g, "\\'") + '\')">Ver</button>' +
                '</div>';
              contenedor.appendChild(div);
            });
          } else {
            contenedor.innerHTML = '<p style="color:#ff6b6b;text-align:center;">Error al cargar</p>';
          }
        })
        .catch(function() {
          contenedor.innerHTML = '<p style="color:#ff6b6b;text-align:center;">Error de conexion</p>';
        });
    }

    function verFotos(carpetaId, nombre) {
      document.getElementById('modal-titulo').textContent = nombre;
      document.getElementById('modal-fotos').style.display = 'block';
      var contenedor = document.getElementById('modal-fotos-container');
      contenedor.innerHTML = '<p style="color:#8892b0;text-align:center;"><span class="spinner"></span> Cargando...</p>';

      apiGet('fotos', { carpetaId: carpetaId })
        .then(function(r) {
          if (r && r.success && r.fotos.length > 0) {
            contenedor.innerHTML = '';
            r.fotos.forEach(function(f) {
              var div = document.createElement('div');
              div.style.cssText = 'margin-bottom:12px;border-radius:10px;overflow:hidden;';
              div.innerHTML =
                '<img src="' + f.url + '" style="width:100%;display:block;">' +
                '<div style="padding:8px;background:rgba(0,0,0,0.5);font-size:0.8rem;">' + f.nombre + '</div>';
              contenedor.appendChild(div);
            });
          } else {
            contenedor.innerHTML = '<p style="color:#8892b0;text-align:center;">No hay fotos</p>';
          }
        })
        .catch(function() {
          contenedor.innerHTML = '<p style="color:#ff6b6b;text-align:center;">Error</p>';
        });
    }

    function cerrarModal() {
      document.getElementById('modal-fotos').style.display = 'none';
    }

    // ============================================
    // UTILIDAD
    // ============================================
    function mostrarEstado(mensaje, tipo) {
      var estado = document.getElementById('estado-captura');
      if (!mensaje) { estado.style.display = 'none'; return; }
      estado.style.display = 'block';
      estado.className = 'estado estado-' + tipo;
      estado.textContent = mensaje;
    }

    // ============================================
    // INIT
    // ============================================
    window.onload = function() {
      if (API_URL) cargarInmuebles();
    };

    document.onkeydown = function(e) {
      if (e.key === 'Escape') {
        cerrarModal();
        cerrarCamara();
      }
    };
  </script>
</body>
</html>
