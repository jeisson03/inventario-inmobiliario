<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Inventario Inmobiliario</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF5500">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Inventario">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #111111, #1a1a1a, #000000); min-height: 100vh; color: #fff; }
    .container { max-width: 500px; margin: 0 auto; padding: 16px; }
    .header { text-align: center; padding: 15px 0; border-bottom: 1px solid rgba(255,255,255,0.1); margin-bottom: 16px; }
    .header h1 { font-size: 1.5rem; font-weight: 700; background: linear-gradient(90deg, #FF5500, #FFB01A); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: #666666; font-size: 0.85rem; margin-top: 4px; }
    .seccion { background: rgba(255,255,255,0.06); border-radius: 16px; padding: 16px; margin-bottom: 16px; border: 1px solid rgba(255,255,255,0.08); }
    .seccion-titulo { font-size: 0.95rem; font-weight: 600; margin-bottom: 12px; }
    .campo { margin-bottom: 12px; }
    .campo label { display: block; font-size: 0.8rem; color: #666666; margin-bottom: 6px; font-weight: 500; }
    .campo input { width: 100%; padding: 12px 14px; border: 2px solid rgba(255,255,255,0.1); border-radius: 10px; background: rgba(0,0,0,0.3); color: #fff; font-size: 1rem; }
    .campo input:focus { outline: none; border-color: #FF5500; }
    .campo input::placeholder { color: #5a6580; }
    .boton { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .boton:disabled { opacity: 0.5; cursor: not-allowed; }
    .boton-primario { background: linear-gradient(90deg, #FF5500, #FFB01A); color: #000; }
    .boton-guardar { background: linear-gradient(90deg, #FF5500, #FFB01A); color: #000; margin-top: 10px; font-size: 1.1rem; padding: 16px; }
    .boton-cancelar { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); margin-top: 8px; }
    .boton-camara { background: linear-gradient(135deg, #FF5500, #FFB01A); color: #000; padding: 18px; font-size: 1.1rem; }
    .boton-galeria { background: linear-gradient(135deg, #666666, #444444); color: #fff; margin-top: 8px; }
    .boton-secundario { background: rgba(255,255,255,0.08); color: #fff; border: 1px solid rgba(255,255,255,0.15); margin-top: 8px; }
    .resumen-fotos { background: rgba(255,85,0,0.1); border: 1px solid rgba(255,85,0,0.2); border-radius: 12px; padding: 12px 16px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
    .resumen-fotos .count { font-size: 1.8rem; font-weight: 700; color: #FF5500; }
    .resumen-fotos .label { font-size: 0.8rem; color: #666666; }
    .subida-info { font-size: 0.75rem; color: #FFB01A; margin-top: 4px; }
    .fotos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
    .foto-card { position: relative; border-radius: 12px; overflow: hidden; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.1); }
    .foto-card img { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
    .foto-card .num { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); border-radius: 6px; padding: 2px 8px; font-size: 0.7rem; font-weight: 700; }
    .foto-card .btn-eliminar { position: absolute; top: 6px; right: 6px; background: rgba(255,50,50,0.9); border: none; border-radius: 50%; width: 28px; height: 28px; color: #fff; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .foto-card .btn-eliminar:active { transform: scale(0.9); }
    .inmueble-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; background: rgba(0,0,0,0.2); border-radius: 10px; margin-bottom: 8px; }
    .inmueble-nombre { font-weight: 600; font-size: 0.9rem; }
    .inmueble-fotos { color: #666666; font-size: 0.75rem; margin-top: 2px; }
    .inmueble-acciones { display: flex; gap: 6px; }
    .btn-sm { padding: 6px 10px; border: none; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .btn-ver { background: rgba(255,85,0,0.2); color: #FF5500; }
    .estado { text-align: center; padding: 12px; border-radius: 10px; margin-top: 12px; font-weight: 500; font-size: 0.9rem; }
    .estado-activo { background: rgba(255,85,0,0.15); color: #FFB01A; }
    .estado-guardando { background: rgba(255,176,26,0.15); color: #FFB01A; }
    .estado-exito { background: rgba(255,85,0,0.15); color: #FFB01A; }
    .estado-error { background: rgba(255,107,107,0.15); color: #ff6b6b; }
    .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: #FF5500; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 6px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #input-galeria { display: none; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,85,0,0.3); border-radius: 2px; }
    @media (max-width: 400px) { .fotos-grid { grid-template-columns: repeat(2, 1fr); } }
    #camara-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: #000; z-index: 2000; flex-direction: column; }
    #camara-overlay.activo { display: flex; }
    #camara-header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; background: rgba(0,0,0,0.85); z-index: 10; }
    .camara-nombre { font-weight: 600; font-size: 0.85rem; color: #FFB01A; }
    .camara-contador { background: rgba(255,85,0,0.85); padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 0.85rem; }
    #camara-video-container { flex: 1; position: relative; overflow: hidden; background: #000; }
    #camara-video { width: 100%; height: 100%; object-fit: cover; }
    #camara-canvas { display: none; }
    #camara-footer { display: flex; justify-content: center; align-items: center; padding: 18px; background: rgba(0,0,0,0.85); gap: 28px; }
    #btn-disparar { width: 75px; height: 75px; border-radius: 50%; border: 5px solid #fff; background: rgba(255,255,255,0.25); cursor: pointer; position: relative; transition: transform 0.1s; }
    #btn-disparar::after { content: ''; position: absolute; top: 7px; left: 7px; right: 7px; bottom: 7px; border-radius: 50%; background: #fff; }
    #btn-disparar:active { transform: scale(0.88); }
    #btn-disparar:active::after { background: #FF5500; }
    .cam-btn { width: 46px; height: 46px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.4); background: rgba(255,255,255,0.1); color: #fff; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .cam-btn.flash-on { background: rgba(255,176,26,0.5); border-color: #FFB01A; }
    .flash-anim { animation: flashFx 0.15s ease; }
    @keyframes flashFx { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    .cam-strip { display: flex; gap: 4px; padding: 6px 10px; background: rgba(0,0,0,0.85); overflow-x: auto; }
    .cam-strip::-webkit-scrollbar { height: 0; }
    .cam-strip-thumb { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; border: 2px solid rgba(255,255,255,0.2); flex-shrink: 0; }
    .cam-strip-thumb.ultima { border-color: #FF5500; }
    .barra-progreso { width: 100%; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; margin-top: 8px; overflow: hidden; }
    .barra-progreso-fill { height: 100%; background: linear-gradient(90deg, #FF5500, #FFB01A); border-radius: 3px; transition: width 0.3s ease; width: 0%; }
    .texto-progreso { color: #666666; font-size: 0.8rem; margin-top: 4px; text-align: center; }
    #modal-fotos { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); z-index:1000; padding:16px; }
    #modal-fotos .inner { max-width:500px; margin:0 auto; height:100%; display:flex; flex-direction:column; }
    #modal-fotos .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    #modal-fotos .topbar h3 { color:#fff; font-size:1rem; }
    #modal-fotos .topbar button { background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
    #modal-fotos .content { flex:1; overflow-y:auto; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <img src="https://andresraiz.com/wp-content/uploads/2021/10/logo-hd-30.09.2021-2.png" alt="Andres Raiz Inmobiliaria" style="max-height:60px; margin-bottom:8px;">
      <h1>Inventario Inmobiliario</h1>
      <p>Organiza tus fotos de propiedades</p>
    </div>

    <div class="seccion" id="seccion-nuevo">
      <div class="seccion-titulo">Nuevo Inmueble</div>
      <div class="campo">
        <label>Nombre del Inmueble</label>
        <input type="text" id="nombre-inmueble" placeholder="Ej: Calle Principal 123">
      </div>
      <button class="boton boton-primario" id="btn-iniciar" onclick="iniciarSesion()">Iniciar</button>
    </div>

    <div class="seccion" id="seccion-captura" style="display:none;">
      <div class="seccion-titulo">Capturar Fotos</div>
      <div class="campo">
        <label>Inmueble: <strong id="inmueble-actual"></strong></label>
      </div>
      <div class="resumen-fotos">
        <div>
          <div class="count" id="count-grande">0</div>
          <div class="label">fotos capturadas</div>
        </div>
        <div style="text-align:right;">
          <div class="subida-info" id="subida-info"></div>
        </div>
      </div>
      <div style="display:flex; gap:10px; margin-top:14px;">
        <button class="boton boton-camara" onclick="abrirCamara()" style="flex:1;">Tomar Fotos</button>
        <button class="boton boton-galeria" onclick="document.getElementById('input-galeria').click()" style="flex:1;">Galeria</button>
      </div>
      <input type="file" id="input-galeria" accept="image/*" multiple onchange="procesarGaleria(event)">
      <div id="fotos-grid" class="fotos-grid"></div>
      <div id="estado-captura" class="estado estado-activo" style="display:none;"></div>
      <div id="progreso-container" style="display:none;">
        <div class="barra-progreso"><div class="barra-progreso-fill" id="barra-progreso"></div></div>
        <div class="texto-progreso" id="texto-progreso"></div>
        <div class="subida-info" id="subida-info"></div>
      </div>
      <button class="boton boton-guardar" id="btn-guardar" onclick="guardarInmueble()">Guardar Inmueble</button>
      <button class="boton boton-cancelar" onclick="cancelarSesion()">Cancelar</button>
    </div>

    <div class="seccion">
      <div class="seccion-titulo">Inmuebles Guardados</div>
      <div id="lista-inmuebles"><p style="color:#8892b0;text-align:center;padding:20px;"><span class="spinner"></span> Cargando...</p></div>
      <button class="boton boton-secundario" onclick="cargarInmuebles()">Actualizar Lista</button>
    </div>
  </div>

  <div id="camara-overlay">
    <div id="camara-header">
      <span class="camara-nombre" id="camara-nombre"></span>
      <span class="camara-contador" id="camara-contador">0 fotos</span>
    </div>
    <div id="camara-video-container">
      <video id="camara-video" autoplay playsinline muted></video>
      <canvas id="camara-canvas"></canvas>
    </div>
    <div class="cam-strip" id="cam-strip"></div>
    <div id="camara-footer">
      <button class="cam-btn" onclick="cerrarCamara()">Listo</button>
      <button id="btn-disparar" onclick="tomarFoto()"></button>
      <button class="cam-btn" id="btn-flash" onclick="toggleFlash()">Flash</button>
    </div>
  </div>

  <div id="modal-fotos">
    <div class="inner">
      <div class="topbar">
        <h3 id="modal-titulo"></h3>
        <button onclick="cerrarModal()">X</button>
      </div>
      <div class="content" id="modal-fotos-container"></div>
    </div>
  </div>

  <script>
    var API_URL = 'https://script.google.com/macros/s/AKfycbz4qb6U_zbKBK1a45i4FgyLC7RbfXmr4j9Wuvmlfzqtsbc2oh5gH-1eSDbreftQmnI3/exec';
    var MAX_PARALELOS = 3;
    var LOTE = 5;
    var DB_NAME = 'InventarioAR';
    var DB_VERSION = 1;
    var db = null;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function() {});
    }

    function openDB() {
      return new Promise(function(resolve, reject) {
        if (db) { resolve(db); return; }
        var req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = function(e) {
          var d = e.target.result;
          if (!d.objectStoreNames.contains('fotos')) {
            d.createObjectStore('fotos', { keyPath: 'id', autoIncrement: true });
          }
          if (!d.objectStoreNames.contains('config')) {
            d.createObjectStore('config', { keyPath: 'key' });
          }
        };
        req.onsuccess = function(e) { db = e.target.result; resolve(db); };
        req.onerror = function() { reject(); };
      });
    }

    function dbAdd(store, data) {
      return openDB().then(function(d) {
        return new Promise(function(resolve, reject) {
          var tx = d.transaction(store, 'readwrite');
          tx.objectStore(store).add(data);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(); };
        });
      });
    }

    function dbGetAll(store) {
      return openDB().then(function(d) {
        return new Promise(function(resolve, reject) {
          var tx = d.transaction(store, 'readonly');
          var req = tx.objectStore(store).getAll();
          req.onsuccess = function() { resolve(req.result); };
          req.onerror = function() { reject(); };
        });
      });
    }

    function dbDelete(store, id) {
      return openDB().then(function(d) {
        return new Promise(function(resolve, reject) {
          var tx = d.transaction(store, 'readwrite');
          tx.objectStore(store).delete(id);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(); };
        });
      });
    }

    function dbClear(store) {
      return openDB().then(function(d) {
        return new Promise(function(resolve, reject) {
          var tx = d.transaction(store, 'readwrite');
          tx.objectStore(store).clear();
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(); };
        });
      });
    }

    function dbPut(store, data) {
      return openDB().then(function(d) {
        return new Promise(function(resolve, reject) {
          var tx = d.transaction(store, 'readwrite');
          tx.objectStore(store).put(data);
          tx.oncomplete = function() { resolve(); };
          tx.onerror = function() { reject(); };
        });
      });
    }

    function apiGet(params) {
      var qs = '';
      for (var k in params) { qs += (qs ? '&' : '?') + k + '=' + encodeURIComponent(params[k]); }
      return fetch(API_URL + qs).then(function(r) { return r.json(); }).catch(function(e) { return null; });
    }

    var inmuebleActualId = null;
    var streamCamara = null;
    var flashOn = false;
    var subiendo = 0;
    var guardando = false;

    function estaOnline() {
      return navigator.onLine;
    }

    function iniciarSesion() {
      var nombre = document.getElementById('nombre-inmueble').value.trim();
      if (!nombre) { alert('Ingresa un nombre'); return; }
      document.getElementById('btn-iniciar').disabled = true;

      if (estaOnline()) {
        apiGet({ action: 'crear', nombre: nombre }).then(function(r) {
          document.getElementById('btn-iniciar').disabled = false;
          if (r && r.success) {
            inmuebleActualId = r.id;
            dbPut('config', { key: 'inmuebleActual', id: r.id, nombre: nombre });
            abrirCaptura(nombre);
          } else {
            alert('Error al crear inmueble. Intenta de nuevo.');
          }
        }).catch(function() {
          document.getElementById('btn-iniciar').disabled = false;
          alert('Error de conexion. Intenta de nuevo.');
        });
      } else {
        var tempId = 'local_' + Date.now();
        inmuebleActualId = tempId;
        dbPut('config', { key: 'inmuebleActual', id: tempId, nombre: nombre, offline: true });
        document.getElementById('btn-iniciar').disabled = false;
        abrirCaptura(nombre);
        alert('Sin internet. Fotos se guardan localmente y se subiran cuando haya señal.');
      }
    }

    function abrirCaptura(nombre) {
      document.getElementById('seccion-nuevo').style.display = 'none';
      document.getElementById('seccion-captura').style.display = 'block';
      document.getElementById('inmueble-actual').textContent = nombre;
      actualizarContador();
      verificarColaPendiente();
    }

    function abrirCamara() {
      document.getElementById('camara-nombre').textContent = document.getElementById('inmueble-actual').textContent;
      document.getElementById('camara-overlay').classList.add('activo');
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false
      }).then(function(stream) { streamCamara = stream; document.getElementById('camara-video').srcObject = stream; })
      .catch(function() { cerrarCamara(); alert('No se pudo acceder a la camara.'); });
    }

    function cerrarCamara() {
      if (streamCamara) { streamCamara.getTracks().forEach(function(t) { t.stop(); }); streamCamara = null; }
      document.getElementById('camara-video').srcObject = null;
      document.getElementById('camara-overlay').classList.remove('activo');
    }

    function tomarFoto() {
      var video = document.getElementById('camara-video');
      var canvas = document.getElementById('camara-canvas');
      if (!video.videoWidth) return;
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      var ctx = canvas.getContext('2d');
      if (flashOn) ctx.filter = 'brightness(1.3)';
      ctx.drawImage(video, 0, 0); ctx.filter = 'none';

      var resizeCanvas = document.createElement('canvas');
      var maxW = 1280;
      var scale = maxW / canvas.width;
      resizeCanvas.width = maxW;
      resizeCanvas.height = canvas.height * scale;
      resizeCanvas.getContext('2d').drawImage(canvas, 0, 0, resizeCanvas.width, resizeCanvas.height);
      var base64 = resizeCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];

      var foto = {
        base64: base64,
        nombre: 'foto_' + Date.now() + '.jpg',
        carpetaId: inmuebleActualId,
        estado: 'pendiente',
        timestamp: Date.now()
      };

      dbAdd('fotos', foto).then(function() {
        var vc = document.getElementById('camara-video-container');
        vc.classList.add('flash-anim'); setTimeout(function() { vc.classList.remove('flash-anim'); }, 150);
        actualizarContador();
        if (estaOnline()) { subirPendientes(); }
      });
    }

    function toggleFlash() { flashOn = !flashOn; document.getElementById('btn-flash').classList.toggle('flash-on', flashOn); }

    function procesarGaleria(event) {
      var archivos = event.target.files;
      if (!archivos || archivos.length === 0) return;
      mostrarEstado('Procesando ' + archivos.length + ' fotos...', 'guardando');
      var procesadas = 0;
      for (var i = 0; i < archivos.length; i++) {
        (function(archivo) {
          var reader = new FileReader();
          reader.onload = function(e) {
            var foto = {
              base64: e.target.result.split(',')[1],
              nombre: 'foto_' + Date.now() + '_' + procesadas + '.jpg',
              carpetaId: inmuebleActualId,
              estado: 'pendiente',
              timestamp: Date.now()
            };
            dbAdd('fotos', foto).then(function() {
              procesadas++;
              if (procesadas === archivos.length) {
                mostrarEstado(procesadas + ' fotos agregadas', 'activo');
                actualizarContador();
                if (estaOnline()) { subirPendientes(); }
              }
            });
          };
          reader.readAsDataURL(archivo);
        })(archivos[i]);
      }
      event.target.value = '';
    }

    function actualizarContador() {
      dbGetAll('fotos').then(function(fotos) {
        var pendientes = fotos.filter(function(f) { return f.estado === 'pendiente'; });
        var subidas = fotos.filter(function(f) { return f.estado === 'subida'; });
        var el = document.getElementById('subida-info');
        if (pendientes.length > 0) {
          el.textContent = subidas.length + ' subidas, ' + pendientes.length + ' pendientes';
          el.style.color = '#FFB01A';
        } else if (subidas.length > 0) {
          el.textContent = subidas.length + ' fotos subidas a Drive';
          el.style.color = '#FFB01A';
        } else {
          el.textContent = '';
        }
        document.getElementById('count-grande').textContent = subidas.length + pendientes.length;
        var total = subidas.length + pendientes.length;
        var pct = total > 0 ? Math.round((subidas.length / total) * 100) : 0;
        document.getElementById('barra-progreso').style.width = pct + '%';
      });
    }

    function subirPendientes() {
      if (subiendo >= MAX_PARALELOS) return;
      if (!estaOnline()) return;

      dbGetAll('fotos').then(function(fotos) {
        var pendientes = fotos.filter(function(f) { return f.estado === 'pendiente'; });
        if (pendientes.length === 0) {
          if (guardando) { finalizarGuardado(); }
          return;
        }

        dbGetAll('config').then(function(configs) {
          var inmConfig = configs.find(function(c) { return c.key === 'inmuebleActual'; });

          function continuarSubida(carpetaId) {
            var lote = pendientes.slice(0, LOTE);
            subiendo++;

            var iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.name = 'upload-' + Date.now();
            document.body.appendChild(iframe);

            var form = document.createElement('form');
            form.method = 'POST';
            form.action = API_URL;
            form.target = iframe.name;
            form.enctype = 'application/x-www-form-urlencoded';

            var inputData = document.createElement('input');
            inputData.type = 'hidden';
            inputData.name = 'data';
            inputData.value = JSON.stringify({ action: 'guardarFotos', carpetaId: carpetaId, fotos: lote.map(function(f) { return { base64: f.base64, nombre: f.nombre }; }) });
            form.appendChild(inputData);
            document.body.appendChild(form);

            iframe.onload = function() {
              subiendo--;
              var promises = lote.map(function(f) {
                return dbDelete('fotos', f.id);
              });
              Promise.all(promises).then(function() {
                actualizarContador();
                form.remove();
                iframe.remove();
                subirPendientes();
              });
            };

            form.submit();
          }

          if (inmConfig && inmConfig.offline && inmConfig.id && inmConfig.id.indexOf('local_') === 0) {
            mostrarEstado('Sincronizando inmueble...', 'guardando');
            apiGet({ action: 'crear', nombre: inmConfig.nombre }).then(function(r) {
              if (r && r.success) {
                var promises = pendientes.map(function(f) {
                  f.carpetaId = r.id;
                  return openDB().then(function(d) {
                    return new Promise(function(resolve) {
                      var tx = d.transaction('fotos', 'readwrite');
                      tx.objectStore('fotos').put(f);
                      tx.oncomplete = resolve;
                    });
                  });
                });
                Promise.all(promises).then(function() {
                  inmuebleActualId = r.id;
                  dbPut('config', { key: 'inmuebleActual', id: r.id, nombre: inmConfig.nombre, offline: false });
                  mostrarEstado('Subiendo fotos...', 'guardando');
                  continuarSubida(r.id);
                });
              } else {
                mostrarEstado('Error al sincronizar', 'error');
                subiendo--;
              }
            });
          } else {
            continuarSubida(inmuebleActualId);
          }
        });
      });
    }

    function verificarColaPendiente() {
      setInterval(function() {
        if (estaOnline()) { subirPendientes(); }
      }, 5000);
      if (estaOnline()) { subirPendientes(); }
    }

    function guardarInmueble() {
      if (guardando) return;
      dbGetAll('fotos').then(function(fotos) {
        var pendientes = fotos.filter(function(f) { return f.estado === 'pendiente'; });
        if (pendientes.length === 0) {
          mostrarEstado('No hay fotos pendientes', 'activo');
          return;
        }
        guardando = true;
        dbPut('config', { key: 'guardandoEstado', value: true });
        document.getElementById('btn-guardar').style.display = 'none';
        document.getElementById('progreso-container').style.display = 'block';
        if (estaOnline()) {
          mostrarEstado('Subiendo ' + pendientes.length + ' fotos...', 'guardando');
          subirPendientes();
        } else {
          mostrarEstado('Sin internet. Se subiran cuando haya senal', 'activo');
          verificarColaPendiente();
        }
      });
    }

    function finalizarGuardado() {
      guardando = false;
      dbPut('config', { key: 'guardandoEstado', value: false });
      document.getElementById('barra-progreso').style.width = '100%';
      mostrarEstado('Guardado! Todas las fotos en Drive', 'exito');
      setTimeout(function() { reiniciarApp(); cargarInmuebles(); }, 1500);
    }

    function cancelarSesion() {
      reiniciarApp();
    }

    function reiniciarApp() {
      inmuebleActualId = null;
      subiendo = 0; guardando = false;
      document.getElementById('nombre-inmueble').value = '';
      document.getElementById('seccion-nuevo').style.display = 'block';
      document.getElementById('seccion-captura').style.display = 'none';
      document.getElementById('btn-guardar').style.display = 'block';
      document.getElementById('progreso-container').style.display = 'none';
      document.getElementById('barra-progreso').style.width = '0%';
      document.getElementById('estado-captura').style.display = 'none';
      document.getElementById('subida-info').textContent = '';
    }

    function cargarInmuebles() {
      var c = document.getElementById('lista-inmuebles');
      c.innerHTML = '<p style="color:#8892b0;text-align:center;"><span class="spinner"></span> Cargando...</p>';
      apiGet({ action: 'listar' }).then(function(r) {
        if (r && r.success) {
          if (r.inmuebles.length === 0) { c.innerHTML = '<p style="color:#8892b0;text-align:center;padding:20px;">No hay inmuebles</p>'; return; }
          c.innerHTML = '';
          r.inmuebles.forEach(function(inm) {
            var div = document.createElement('div');
            div.className = 'inmueble-item';
            div.innerHTML = '<div class="inmueble-nombre">' + inm.nombre + '</div>';
            c.appendChild(div);
          });
        } else { c.innerHTML = '<p style="color:#ff6b6b;text-align:center;">Error al cargar</p>'; }
      }).catch(function() { c.innerHTML = '<p style="color:#ff6b6b;text-align:center;">Sin conexion</p>'; });
    }

    function mostrarEstado(mensaje, tipo) {
      var e = document.getElementById('estado-captura');
      if (!mensaje) { e.style.display = 'none'; return; }
      e.style.display = 'block'; e.className = 'estado estado-' + tipo; e.textContent = mensaje;
    }

    function verificarPendientesAlVolver() {
      if (guardando) return;
      dbGetAll('fotos').then(function(fotos) {
        var pendientes = fotos.filter(function(f) { return f.estado === 'pendiente'; });
        var subidas = fotos.filter(function(f) { return f.estado === 'subida'; });
        if (pendientes.length > 0) {
          dbGetAll('config').then(function(configs) {
            var inmConfig = configs.find(function(c) { return c.key === 'inmuebleActual'; });
            var guardandoConfig = configs.find(function(c) { return c.key === 'guardandoEstado'; });
            if (inmConfig) {
              guardando = true;
              dbPut('config', { key: 'guardandoEstado', value: true });
              inmuebleActualId = inmConfig.id;
              document.getElementById('seccion-nuevo').style.display = 'none';
              document.getElementById('seccion-captura').style.display = 'block';
              document.getElementById('inmueble-actual').textContent = inmConfig.nombre;
              document.getElementById('count-grande').textContent = pendientes.length + subidas.length;
              document.getElementById('btn-guardar').style.display = 'none';
              document.getElementById('progreso-container').style.display = 'block';
              var el = document.getElementById('subida-info');
              el.textContent = subidas.length + ' de ' + (pendientes.length + subidas.length) + ' fotos subidas';
              el.style.color = '#FFB01A';
              mostrarEstado('Subiendo fotos automaticamente...', 'guardando');
              verificarColaPendiente();
              if (estaOnline()) { subirPendientes(); }
            }
          });
        }
      });
    }

    window.onload = function() {
      cargarInmuebles();
      verificarPendientesAlVolver();
    };

    window.addEventListener('visibilitychange', function() {
      if (!document.hidden && estaOnline()) {
        verificarPendientesAlVolver();
      }
    });

    window.addEventListener('online', function() {
      verificarPendientesAlVolver();
    });
    window.addEventListener('offline', function() {
      mostrarEstado('Sin internet. Las fotos se guardan localmente', 'activo');
    });
  </script>
</body>
</html>
